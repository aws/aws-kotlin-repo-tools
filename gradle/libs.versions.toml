[versions]
kotlin-version = "2.4.21"
ktlint-version = "1.8.0"
publish-plugin-version = "2.2.1"
smithy-version = "1.74.1"
smithy-gradle-plugin-version = "1.5.0"
coroutines-version = "1.11.0"
slf4j-version = "2.0.20"
okhttp-version = "5.5.0"
kotlinx-serialization-version = "1.11.0"
proguard-version = "7.10.0"
# Must match the Dokka version used by consuming repos (aws-sdk-kotlin, smithy-kotlin: 2.2.0).
# A Dokka plugin links against dokka-base/dokka-core APIs that are version-coupled to the Dokka runtime.
dokka-version = "2.2.0"
# The jsoup version dokka-base 2.2.0 depends on; dokka-lazy-load compiles against it and uses Dokka's copy at runtime.
jsoup-version = "1.16.1"

[libraries]
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-version" }
ktlint-cli-ruleset-core = { module = "com.pinterest.ktlint:ktlint-cli-ruleset-core", version.ref = "ktlint-version" }
ktlint-rule-engine = { module = "com.pinterest.ktlint:ktlint-rule-engine", version.ref = "ktlint-version" }
smithy-model = { module = "software.amazon.smithy:smithy-model", version.ref = "smithy-version" }
smithy-gradle-base-plugin = { module = "software.amazon.smithy.gradle:smithy-base", version.ref = "smithy-gradle-plugin-version" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines-version" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-version" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j-version" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-version" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-version" }
proguard = { module = "com.guardsquare:proguard-gradle", version.ref = "proguard-version" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-version" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-version" }
dokka-core = { module = "org.jetbrains.dokka:dokka-core", version.ref = "dokka-version" }
dokka-base = { module = "org.jetbrains.dokka:dokka-base", version.ref = "dokka-version" }
dokka-templating-plugin = { module = "org.jetbrains.dokka:templating-plugin", version.ref = "dokka-version" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup-version" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "publish-plugin-version"}
